<div class="portal-shell">
  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand" routerLink="/inicio" aria-label="BX+, ir al inicio">
      <img class="brand-logo" src="/logos_bx+/logo_BX+_color2.png" alt="BX+" />
      <img class="brand-logo_odc" src="/logos_bx+/logo_ODC.png" alt="ODC" />
    </a>

    <nav class="main-nav">
      @for (item of navigation; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          [attr.aria-label]="item.label"
          [attr.title]="item.label"
        >
          <span
            class="nav-icon"
            [style.--nav-icon]="'url(' + item.icon + ')'"
            aria-hidden="true"
          ></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button class="utility-button notification-button" type="button" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
      </button>
      <button class="utility-button profile-button" type="button" aria-label="Perfil de Juan Vázquez">JV</button>
    </div>
  </aside>

  <main class="page-content">
    <router-outlet />
  </main>
</div>
