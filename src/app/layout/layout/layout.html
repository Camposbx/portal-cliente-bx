<div class="portal-shell">
  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand" routerLink="/inicio" aria-label="BX+, ir al inicio">
      <span class="brand-word">BX<span>+</span></span>
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    </a>

    <nav class="main-nav">
      @for (item of navigation; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.aria-label]="item.label"
          [attr.title]="item.label"
        >
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            @switch (item.icon) {
              @case ('home') {
                <path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" />
              }
              @case ('analysis') {
                <path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8" />
                <path d="M13 3v5h5M13 3l5 5M8 12h5M8 16h3" />
                <circle cx="17" cy="17" r="3" />
                <path d="m19.2 19.2 2 2" />
              }
              @case ('contract') {
                <path d="M7 3h8l4 4v5M15 3v5h4M7 3a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h5" />
                <path d="M8 11h7M8 15h4M15 18l2 2 4-5" />
              }
              @case ('operation') {
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <path d="M8 9h8M8 13h5M8 17h3M16 16l1.5 1.5L20 15" />
              }
              @case ('executive') {
                <rect x="3" y="7" width="18" height="14" rx="2" />
                <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M12 11v6" />
              }
              @case ('help') {
                <circle cx="12" cy="12" r="9" />
                <path d="M9.7 9a2.4 2.4 0 1 1 4.3 1.5c-.8 1-2 1.2-2 2.5M12 16.5v.1" />
              }
            }
          </svg>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button class="utility-button notification-button" type="button" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
      </button>
      <button class="utility-button profile-button" type="button" aria-label="Perfil de Juan Vázquez">JV</button>
    </div>
  </aside>

  <main class="page-content">
    <router-outlet />
  </main>
</div>
