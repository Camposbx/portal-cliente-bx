<div class="analysis-shell">
  <aside class="analysis-panel">
    <h1 class="analysis-title text-display-xs">Análisis y autorización</h1>

    <section class="side-card applicant-card" aria-labelledby="applicant-title">
      <h2 id="applicant-title" class="card-heading text-label-sm">Solicitante</h2>
      <div class="applicant-details">
        <span class="applicant-avatar" role="img" aria-label="Documentación parcialmente cargada">
          <mat-icon aria-hidden="true">person</mat-icon>
          <span class="document-status document-status--partial" aria-hidden="true"></span>
        </span>
        <a
          class="applicant-name text-label-sm"
          routerLink="/analisis/documentos"
          (click)="seleccionarSolicitante()"
        >
          {{ nombreSolicitante }}
        </a>
      </div>
    </section>

    <section class="side-card people-card" aria-labelledby="people-title">
      <div class="people-heading">
        <h2 id="people-title" class="text-body-sm-medium">Personas involucradas</h2>
        <a
          class="view-people"
          routerLink="/analisis/personas-involucradas"
          aria-label="Ver personas involucradas"
          title="Ver personas involucradas"
        >
          <mat-icon aria-hidden="true">visibility</mat-icon>
        </a>
      </div>
      @if (personas().length > 0) {
        <div class="people-list" aria-label="Personas registradas">
          @for (persona of personas(); track persona.id) {
            <button
              type="button"
              class="involved-person"
              [attr.aria-pressed]="selectedName() === persona.nombre"
              (click)="seleccionarPersona(persona.nombre)"
            >
              <span class="person-avatar" role="img" aria-label="Documentación parcialmente cargada">
                <mat-icon aria-hidden="true">person</mat-icon>
                <span class="document-status document-status--partial" aria-hidden="true"></span>
              </span>
              <span class="person-name text-body-sm-medium">{{ persona.nombre }}</span>
            </button>
          }
        </div>
      } @else {
        <div class="people-empty-state">
          <div class="people-avatars" aria-hidden="true">
            <span class="person-avatar"><mat-icon>person</mat-icon></span>
            <span class="person-avatar"><mat-icon>person</mat-icon></span>
            <span class="person-avatar"><mat-icon>person</mat-icon></span>
          </div>
          <p class="people-prompt text-label-sm">Registra las personas involucradas</p>
        </div>
      }
      <button
        mat-flat-button
        type="button"
        class="register-button text-label-sm"
        routerLink="/analisis/registro-persona"
      >
        Registrar persona
      </button>
    </section>
  </aside>

  <main class="analysis-content">
    <router-outlet />
  </main>
</div>
